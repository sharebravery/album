name: Cache Pulse test image

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/cache-pulse-test-image.yml"

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and validate image
        run: |
          mkdir -p pulse/article/2026/07/25
          curl --fail --location --retry 3 --max-time 30 \
            https://raw.githubusercontent.com/github/explore/main/topics/typescript/typescript.png \
            --output pulse/article/2026/07/25/github-typescript-logo.png
          file pulse/article/2026/07/25/github-typescript-logo.png | grep -q "PNG image data"
          test "$(wc -c < pulse/article/2026/07/25/github-typescript-logo.png)" -lt 5242880
      - name: Commit cached image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pulse/article/2026/07/25/github-typescript-logo.png
          git diff --cached --quiet && exit 0
          git commit -m "Cache Pulse GitHub Raw image test"
          git push origin HEAD:master
