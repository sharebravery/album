name: One-time cleanup Toutiao image tests

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/one-time-cleanup-toutiao-tests.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary test assets and results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch -- \
            pulse/tests/toutiao/2026-07-29/agent-security-hero-control.png \
            pulse/tests/toutiao/2026-07-29/synthetic-attack-data-control.jpg \
            pulse/tests/toutiao/2026-07-29/vulnerability-catalog-control.jpg \
            pulse/tests/toutiao/2026-07-29/prompt-injection-defense-flywheel-control.jpg \
            results/2026-07-29-toutiao-format-control-hero-png.json \
            results/2026-07-29-toutiao-format-control-diagram-jpg.json \
            results/2026-07-29-toutiao-jpg-confirmation.json \
            .github/workflows/one-time-cleanup-toutiao-tests.yml
          git commit -m "Remove temporary Toutiao image tests"
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase -X theirs origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
