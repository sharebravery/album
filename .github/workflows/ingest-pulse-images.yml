name: Ingest Pulse images

on:
  push:
    branches: [master]
    paths:
      - "requests/*.json"
      - ".github/workflows/ingest-pulse-images.yml"
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pulse-album-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for requests
        id: requests
        shell: bash
        run: |
          if compgen -G "requests/*.json" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No image-ingestion requests found."
          fi

      - name: Install image normalizer
        if: steps.requests.outputs.found == 'true'
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "Pillow>=10,<13"

      - name: Validate ingestion scripts
        if: steps.requests.outputs.found == 'true'
        run: python3 -m py_compile scripts/*.py

      - name: Download and validate images
        if: steps.requests.outputs.found == 'true'
        run: python3 scripts/ingest_requests.py prepare

      - name: Finalize fixed-path results
        if: steps.requests.outputs.found == 'true'
        run: python3 scripts/ingest_requests.py finalize

      - name: Commit assets, results and completed requests
        if: steps.requests.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- pulse results requests

          if git diff --cached --quiet; then
            echo "No ingestion changes to commit."
          else
            git commit -m "Complete Pulse image ingestion"

            for attempt in 1 2 3; do
              git fetch origin master
              git rebase -X theirs origin/master
              if git push origin HEAD:master; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to publish image assets after three attempts." >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi
